<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100% 100%" width="100%" height="100%">
    <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml" style="margin:0; width:100vw; height:100vh; background:#000; overflow:hidden;">
            <style>
                body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
                #app-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; color: #fff; font-family: sans-serif; }
            </style>
            <div id="app-container">
                <!-- Direct inline execution block bypassing frame restrictions -->
                <script type="text/javascript">
                    // Fetch and evaluate your application logic directly into the DOM
                    fetch('./nfg.html')
                        .then(response => response.text())
                        .then(html => {
                            const parser = new DOMParser();
                            const doc = parser.parseFromString(html, 'text/html');
                            document.open();
                            document.write(html);
                            document.close();
                        })
                        .catch(err => {
                            document.getElementById('app-container').innerText = "Load Error: " + err;
                        });
                </script>
            </div>
        </div>
    </foreignObject>
</svg>
