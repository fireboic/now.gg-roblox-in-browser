<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml" style="margin:0; width:100vw; height:100vh; background:#000; overflow:hidden;">
            <iframe id="content-frame" style="width:100%; height:100%; border:none;" src="./nfg.html"></iframe>
            <script>
                const hash = window.location.hash;
                const frame = document.getElementById('content-frame');
                if (hash.includes("roblox")) {
                    frame.src = "./nfg.html";
                }
            </script>
        </div>
    </foreignObject>
</svg>
